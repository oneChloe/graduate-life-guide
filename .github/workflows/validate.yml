name: 检查指南内容

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查关卡结构和资料来源
        run: |
          node scripts/build-content.mjs --check
          node scripts/validate-content.mjs
